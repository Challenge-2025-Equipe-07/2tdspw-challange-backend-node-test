services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: veti
      POSTGRES_USER: veti
      POSTGRES_PASSWORD: veti
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veti -d veti"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - veti_pg:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'

volumes:
  veti_pg:
